server:
  port: ${PORT:8080}
spring:
  application:
    name: toxicity-inference-service
  servlet:
    multipart:
      enabled: false

toxicity:
  # Rutas a los artefactos del modelo (ver docs/model.md).
  max-tokens: ${TOXICITY_MAX_TOKENS:256}
  model-path: ${TOXICITY_MODEL_PATH:models/onnx/model.onnx}
  tokenizer-path: ${TOXICITY_TOKENIZER_PATH:models/tokenizer.json}
  # Límites provisionales: aún no se ajustaron con mediciones en el entorno de despliegue (ver docs/deployment.md).
  max-chars: ${TOXICITY_MAX_CHARS:5000}
  max-concurrent-inferences: ${TOXICITY_MAX_CONCURRENT:4}
  inference-timeout: ${TOXICITY_INFERENCE_TIMEOUT:10s}
  # Sin valor por defecto: el secreto solo viene del entorno.
  api-key: ${TOXICITY_API_KEY:}
  # Solo para desarrollo local: sin API key el servicio NO arranca salvo que esto sea true.
  auth-disabled: ${TOXICITY_AUTH_DISABLED:false}

  # Segundo clasificador (independiente): bgonzalezbustamante/bert-spanish-toxicity, ver docs/model-spanish.md.
  spanish:
    model-path: ${TOXICITY_SPANISH_MODEL_PATH:models/spanish/model.onnx}
    tokenizer-path: ${TOXICITY_SPANISH_TOKENIZER_PATH:models/spanish/tokenizer.json}
    config-path: ${TOXICITY_SPANISH_CONFIG_PATH:models/spanish/config.json}
    revision: fe9d55ff4c871f314b4c8a9878468cd49e36697a
    max-tokens: ${TOXICITY_SPANISH_MAX_TOKENS:256}
    max-concurrent-inferences: ${TOXICITY_SPANISH_MAX_CONCURRENT:2}
    # 0 = hilos de ONNX Runtime igual a las CPUs que ve la JVM (respeta el límite de vCPU del contenedor).
    intra-op-threads: ${TOXICITY_SPANISH_INTRA_OP_THREADS:0}
